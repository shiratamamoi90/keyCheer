<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>KeyCheer</title>
    <style>
      /* 見た目は仕様外(デザイン判断)。ここでは「読めて操作できる」だけを満たす。 */
      html,
      body {
        margin: 0;
        height: 100%;
        /* Windows がターゲットのため Yu Gothic UI / Meiryo を優先する。
           それ以外(WSL での開発時など)でも豆腐にならないよう、CJK を持つ
           一般的なフォントへフォールバックする。CSP が default-src 'none' で
           font-src を許可していないため、Web フォントは使わず OS のフォントのみに頼る。 */
        font-family:
          "Yu Gothic UI", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
      }
      .form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
        font-size: 14px;
      }
      .form h1 {
        margin: 0;
        font-size: 18px;
      }
      .form label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .form input,
      .form textarea,
      .form select {
        font: inherit;
        padding: 6px;
      }
      .form button {
        align-self: flex-start;
        font: inherit;
        padding: 6px 20px;
      }
      .error {
        margin: 0;
        color: #c0392b;
      }
      .notice {
        color: #b9770e;
      }
      .status {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- バンドラを使わないため UMD グローバルとして読み込む(mainEntry.ts 参照) -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script type="module" src="./mainEntry.js"></script>
  </body>
</html>
