<!doctype html>
<html lang="ja" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; media-src keycheer-audio:; img-src keycheer-audio:"
    />
    <title></title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <!-- 絵とセリフの置き場(位置と大きさ)は popup.ts が core/shared/popupLayout から当てる(論点 0052)。
       body の visible は popup.ts が付け外しする(出すときだけ不透明にする) -->
  <body
    class="m-0 flex h-full items-end justify-center overflow-hidden bg-transparent font-ui opacity-0 transition-opacity duration-150 ease-out [&.visible]:opacity-100"
  >
    <div id="character" class="relative h-full w-full">
      <!-- セリフの領域。吹き出しを上端に寄せて、絵のすぐ下に出す(S0053_01)。クリックは通す -->
      <div id="message-area" class="pointer-events-none absolute flex items-start justify-center">
        <div
          id="cheer-message"
          class="box-border max-h-full max-w-full overflow-hidden break-words rounded-lg bg-[rgb(24_24_32/0.92)] px-2 py-1 text-center leading-[1.3] text-white empty:hidden"
        ></div>
      </div>
      <img
        id="character-image"
        alt=""
        hidden
        class="absolute cursor-grab select-none object-contain [-webkit-user-drag:none] active:cursor-grabbing"
      />
    </div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
