<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; media-src keycheer-audio:" />
    <title>KeyCheer</title>
    <style>
      /* 見た目は仕様外(デザイン判断)。ここでは「読める・入力を邪魔しない」だけを満たす。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        /* main.html と同じフォールバック(Windows 優先 + CJK を持つ一般的なフォント)。
           CSP が font-src を許可していないため Web フォントは使わない。 */
        font-family:
          "Yu Gothic UI", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        opacity: 0;
        transition: opacity 150ms ease-out;
      }
      body.visible {
        opacity: 1;
      }
      #cheer-message {
        margin: 16px;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(24, 24, 32, 0.92);
        color: #fff;
        font-size: 18px;
        line-height: 1.4;
        text-align: center;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="cheer-message"></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
